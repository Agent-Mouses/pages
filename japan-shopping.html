<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🇯🇵 日本購物清單（橫濱・東京）</title>
<style>
  :root{--bg:#faf7f2;--card:#fff;--ac:#e88;--tx:#333;--mut:#888;--line:#eee;}
  *{box-sizing:border-box;}
  body{font-family:-apple-system,"Segoe UI","Noto Sans TC",sans-serif;background:var(--bg);color:var(--tx);margin:0;padding:16px;line-height:1.7;}
  h1{font-size:1.4rem;margin:.2em 0;}
  .sub{color:var(--mut);font-size:.85rem;margin-bottom:1em;}
  .box{background:var(--card);border-radius:14px;padding:14px 16px;margin:14px 0;box-shadow:0 1px 4px rgba(0,0,0,.06);}
  h2{font-size:1.05rem;margin:.3em 0 .5em;border-left:5px solid var(--ac);padding-left:8px;}
  label{display:flex;align-items:flex-start;gap:9px;padding:6px 2px;border-bottom:1px solid var(--line);cursor:pointer;font-size:.94rem;}
  label:last-child{border-bottom:none;}
  input[type=checkbox]{width:20px;height:20px;margin-top:2px;flex-shrink:0;accent-color:var(--ac);}
  .done span{text-decoration:line-through;color:var(--mut);}
  .price{color:#c60;font-weight:600;font-size:.85rem;}
  .note{background:#fff9e6;border-radius:10px;padding:10px 14px;font-size:.85rem;color:#665;margin:12px 0;}
  a{color:#39c;word-break:break-all;}
  .tag{display:inline-block;background:#f2e8e8;color:#a55;border-radius:6px;padding:1px 7px;font-size:.72rem;margin-left:4px;}
</style>
</head>
<body>

</div>

<script>
  const KEY='japan-shopping-v1';
  const boxes=[...document.querySelectorAll('input[type=checkbox]')];
  const saved=JSON.parse(localStorage.getItem(KEY)||'[]');
  boxes.forEach((b,i)=>{
    if(saved[i]){b.checked=true;b.closest('label').classList.add('done');}
    b.addEventListener('change',()=>{
      b.closest('label').classList.toggle('done',b.checked);
      localStorage.setItem(KEY,JSON.stringify(boxes.map(x=>x.checked)));
    });
  });
</script>
</body>
</html>
